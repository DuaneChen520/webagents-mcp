<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>WebAgents 设置</title>
  <style>
    :root { --accent: #4f6ef7; --bg: #f6f7fb; --card: #ffffff; --border: #e6e9f2; --text: #23283b; --sub: #8a91a8; }
    body { font-family: "Microsoft YaHei", system-ui, sans-serif; max-width: 520px; margin: 40px auto; padding: 0 18px 20px; color: var(--text); background: var(--bg); }
    header { display: flex; align-items: center; gap: 10px; margin-bottom: 2px; }
    .logo { width: 30px; height: 30px; border-radius: 9px; background: linear-gradient(135deg, #4f6ef7, #8b5cf6); display: inline-flex; align-items: center; justify-content: center; color: #fff; font-size: 15px; font-weight: 700; }
    h1 { font-size: 20px; margin: 0; }
    .hint { color: var(--sub); font-size: 12px; margin: 6px 0 16px; line-height: 1.55; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 14px 18px 16px; margin-bottom: 12px; box-shadow: 0 1px 3px rgba(30,40,90,.05); }
    .card-title { font-weight: 600; font-size: 12px; color: var(--sub); letter-spacing: .5px; margin-bottom: 2px; }
    .row { padding: 10px 0 12px; }
    .row + .row { border-top: 1px dashed var(--border); }
    .row-label { font-size: 14px; margin-bottom: 8px; }
    .seg { display: flex; background: #eef0f7; border-radius: 10px; padding: 3px; gap: 3px; max-width: 320px; }
    .seg button { flex: 1; border: none; background: transparent; color: var(--sub); font-size: 13px; padding: 7px 0; border-radius: 8px; cursor: pointer; transition: all .15s; font-family: inherit; }
    .seg button:hover { color: var(--text); }
    .seg button.active { background: #fff; color: var(--accent); font-weight: 600; box-shadow: 0 1px 4px rgba(30,40,90,.14); }
    .footer { display: flex; align-items: center; gap: 14px; margin-top: 16px; }
    #save { background: linear-gradient(135deg, #4f6ef7, #6d5df6); color: #fff; border: none; border-radius: 10px; padding: 9px 32px; font-size: 14px; font-weight: 600; cursor: pointer; box-shadow: 0 2px 8px rgba(79,110,247,.35); transition: filter .15s; font-family: inherit; }
    #save:hover { filter: brightness(1.08); }
    #status { color: #17a561; font-size: 13px; font-weight: 600; opacity: 0; transition: opacity .25s; }
    #status.show { opacity: 1; }
  </style>
</head>
<body>
  <header><span class="logo">W</span><h1>WebAgents 对话开关</h1></header>
  <p class="hint">强制开关，优先级最高（覆盖调用方参数）；「默认」= 不干预页面当前状态。</p>

  <div class="card">
    <div class="card-title">DEEPSEEK</div>
    <div class="row">
      <div class="row-label">深度思考</div>
      <div class="seg" id="dsDeepThink">
        <button data-value="">默认</button><button data-value="on">开</button><button data-value="off">关</button>
      </div>
    </div>
    <div class="row">
      <div class="row-label">联网搜索</div>
      <div class="seg" id="dsSearch">
        <button data-value="">默认</button><button data-value="on">开</button><button data-value="off">关</button>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="card-title">千问</div>
    <div class="row">
      <div class="row-label">对话模式</div>
      <div class="seg" id="qwenMode">
        <button data-value="">默认</button><button data-value="fast">快速</button><button data-value="think">思考研究</button>
      </div>
    </div>
  </div>

  <div class="footer">
    <button id="save">保存</button>
    <span id="status">已保存 ✓</span>
  </div>

  <script src="options.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>WebAgents 设置</title>
  <style>
    :root { --accent: #4f6ef7; --bg: #f6f7fb; --card: #ffffff; --border: #e6e9f2; --text: #23283b; --sub: #8a91a8; }
    body { font-family: "Microsoft YaHei", system-ui, sans-serif; width: 360px; margin: 0; padding: 16px 18px 14px; color: var(--text); background: var(--bg); }
    header { display: flex; align-items: center; gap: 8px; margin-bottom: 2px; }
    .logo { width: 22px; height: 22px; border-radius: 7px; background: linear-gradient(135deg, #4f6ef7, #8b5cf6); display: inline-flex; align-items: center; justify-content: center; color: #fff; font-size: 12px; font-weight: 700; }
    h1 { font-size: 15px; margin: 0; }
    .hint { color: var(--sub); font-size: 11px; margin: 4px 0 12px; line-height: 1.55; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 10px 14px 12px; margin-bottom: 10px; box-shadow: 0 1px 3px rgba(30,40,90,.05); }
    .card-title { font-weight: 600; font-size: 12px; color: var(--sub); letter-spacing: .5px; margin-bottom: 2px; }
    .row { padding: 8px 0 10px; }
    .row-label { font-size: 13px; margin-bottom: 7px; }
    .seg { display: flex; background: #eef0f7; border-radius: 9px; padding: 3px; gap: 3px; }
    .seg button { flex: 1; border: none; background: transparent; color: var(--sub); font-size: 12px; padding: 6px 0; border-radius: 7px; cursor: pointer; transition: all .15s; font-family: inherit; }
    .seg button:hover { color: var(--text); }
    .seg button.active { background: #fff; color: var(--accent); font-weight: 600; box-shadow: 0 1px 4px rgba(30,40,90,.14); }
    .footer { display: flex; align-items: center; justify-content: space-between; margin-top: 12px; }
    #save { background: linear-gradient(135deg, #4f6ef7, #6d5df6); color: #fff; border: none; border-radius: 9px; padding: 8px 26px; font-size: 13px; font-weight: 600; cursor: pointer; box-shadow: 0 2px 8px rgba(79,110,247,.35); transition: filter .15s; font-family: inherit; }
    #save:hover { filter: brightness(1.08); }
    #status { color: #17a561; font-size: 12px; font-weight: 600; opacity: 0; transition: opacity .25s; }
    #status.show { opacity: 1; }
    .perm-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .plain { background: #fff; border: 1px solid var(--border); border-radius: 8px; padding: 6px 14px; font-size: 12px; color: var(--text); cursor: pointer; font-family: inherit; transition: all .15s; }
    .plain:hover { border-color: var(--accent); color: var(--accent); }
    .state { font-size: 11px; color: var(--sub); }
    .state.ok { color: #17a561; font-weight: 600; }
  </style>
</head>
<body>
  <header><span class="logo">W</span><h1>WebAgents 对话开关</h1></header>
  <p class="hint">强制开关，优先级最高（覆盖调用方参数）；「默认」= 不干预页面当前状态。同一站点同一时刻只处理一个任务，多任务会自动排队。</p>

  <div class="card">
    <div class="card-title">DEEPSEEK</div>
    <div class="row">
      <div class="row-label">深度思考</div>
      <div class="seg" id="dsDeepThink">
        <button data-value="">默认</button><button data-value="on">开</button><button data-value="off">关</button>
      </div>
    </div>
    <div class="row">
      <div class="row-label">联网搜索</div>
      <div class="seg" id="dsSearch">
        <button data-value="">默认</button><button data-value="on">开</button><button data-value="off">关</button>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="card-title">千问</div>
    <div class="row">
      <div class="row-label">对话模式</div>
      <div class="seg" id="qwenMode">
        <button data-value="">默认</button><button data-value="fast">快速</button><button data-value="think">思考研究</button>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="card-title">调用节流</div>
    <div class="row">
      <div class="row-label">同站点两次提问的最小间隔</div>
      <div class="seg" id="throttleSec">
        <button data-value="0">关闭</button><button data-value="3">3 秒</button><button data-value="8">8 秒</button><button data-value="20">20 秒</button>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="card-title">备用输入通道（按需授权）</div>
    <div class="row">
      <div class="row-label">可信输入（chrome.debugger）—— 当前无调用方，仅备用</div>
      <div class="perm-row">
        <button id="grantDebug" class="plain">授予</button>
        <button id="revokeDebug" class="plain">撤销</button>
        <span id="debugState" class="state">检测中…</span>
      </div>
    </div>
  </div>

  <div class="footer">
    <button id="save">保存</button>
    <span id="status">已保存 ✓</span>
  </div>

  <script src="options.js"></script>
</body>
</html>
